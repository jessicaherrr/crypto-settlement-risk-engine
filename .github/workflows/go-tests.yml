name: Go Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'services/chain-indexer/**'
  pull_request:
    paths:
      - 'services/chain-indexer/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chain-indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
