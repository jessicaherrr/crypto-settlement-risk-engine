name: Contract Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'
      - 'hardhat.config.js'
      - 'package.json'
  pull_request:
    paths:
      - 'contracts/**'
      - 'hardhat.config.js'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run compile
      - run: npm run test:contracts
