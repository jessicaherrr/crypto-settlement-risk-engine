[project]
name = "askgene-quant"
version = "0.1.0"
description = "Crypto Settlement Risk Engine quantitative risk engine: volatility modeling, VaR/ES, stress testing, and risk-quote generation for crypto-denominated escrow."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pydantic>=2.6",
    "arch>=7.0",
    "requests>=2.31",
    "pyarrow>=16.0",
    "pycryptodome>=3.20",
    "eth-account>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
]
notebook = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "nbformat>=5.10",
]
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
